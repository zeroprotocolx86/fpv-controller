<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>FPV Controller</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{width:100%;height:100%;overflow:hidden;background:#0d1117;color:#e6edf3;font-family:system-ui,sans-serif}

.hdr{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:rgba(13,17,23,.95);backdrop-filter:blur(10px);border-bottom:1px solid #21262d}
.conn{display:flex;align-items:center;gap:6px;font-size:11px}
.dot{width:8px;height:8px;border-radius:50%;background:#f85149;transition:background .3s}
.dot.on{background:#3fb950}
.lbl{font-size:14px;font-weight:700;color:#fff}
.btn{background:rgba(255,255,255,.06);border:1px solid #30363d;color:#8b949e;padding:6px 10px;border-radius:8px;font-size:16px;cursor:pointer}
.btn:active{background:rgba(255,255,255,.12)}

.sticks{position:fixed;top:0;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:center;padding:56px 10px 70px}
.stick-wrap{width:48%;aspect-ratio:1;position:relative;touch-action:none}
.base{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.04),transparent 70%);border:2px solid #30363d}
.cross{position:absolute;background:#30363d}
.cross.h{width:100%;height:1px;top:50%}
.cross.v{width:1px;height:100%;left:50%}
.ring{position:absolute;border-radius:50%;border:1px solid rgba(255,255,255,.08)}
.knob{position:absolute;width:54px;height:54px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#484f58,#1c2128);border:2px solid #484f58;box-shadow:0 2px 16px rgba(0,0,0,.5);transform:translate(-50%,-50%);z-index:10;pointer-events:none}
.knob.on{border-color:#58a6ff}
.knob::after{content:'';position:absolute;width:8px;height:8px;border-radius:50%;background:#6e7681;top:7px;left:50%;transform:translateX(-50%)}
.knob.on::after{background:#58a6ff}
.ch-lbl{position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);font-size:9px;color:#484f58;white-space:nowrap}

.bot{position:fixed;bottom:0;left:0;right:0;z-index:100;display:flex;justify-content:space-around;padding:8px 12px;background:rgba(13,17,23,.95);backdrop-filter:blur(10px);border-top:1px solid #21262d}
.vg{text-align:center;min-width:60px}
.vg small{font-size:8px;color:#484f58;text-transform:uppercase;letter-spacing:1px}
.vg .n{display:block;font-size:15px;font-weight:700;font-family:monospace}
.c1{color:#f85149}.c2{color:#58a6ff}.c3{color:#3fb950}.c4{color:#d29922}

.modal{display:none;position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.92);backdrop-filter:blur(20px);padding:20px;padding-top:max(20px,env(safe-area-inset-top));overflow-y:auto}
.modal.show{display:block}
.modal h2{font-size:15px;margin-bottom:12px;color:#fff}
.rw{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #21262d}
.rw label{font-size:13px;color:#c9d1d9}
.rw .vv{color:#58a6ff;font-weight:600;font-size:13px}
input[type=range]{width:110px;accent-color:#58a6ff}
.x{position:absolute;top:14px;right:14px;background:none;border:none;color:#8b949e;font-size:22px;padding:8px}
.mbtns{display:flex;gap:8px;margin-top:10px}
.mbtns button{flex:1;padding:10px;border-radius:8px;font-size:12px;border:1px solid #30363d;background:#161b22;color:#8b949e}
.mbtns button.a{border-color:#3fb950;color:#3fb950;background:rgba(63,185,80,.1)}

.hint{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:50;font-size:13px;color:#58a6ff;pointer-events:none;opacity:0;transition:opacity .5s;text-align:center}
.hint.show{opacity:1}
</style>
</head>
<body>

<div class="hdr">
  <div class="lbl">FPV</div>
  <div class="conn"><div class="dot" id="cd"></div><span id="ct">...</span></div>
  <div style="display:flex;gap:6px">
    <button class="btn" onclick="goFS()">⛶</button>
    <button class="btn" onclick="openCfg()">⚙</button>
  </div>
</div>

<div class="sticks">
  <div class="stick-wrap" id="boxR">
    <div class="base"></div><div class="cross h"></div><div class="cross v"></div>
    <div class="ring" style="inset:18%"></div><div class="ring" style="inset:36%"></div>
    <div class="knob" id="kR"></div>
    <div class="ch-lbl">ROLL · PITCH</div>
  </div>
  <div class="stick-wrap" id="boxL">
    <div class="base"></div><div class="cross h"></div><div class="cross v"></div>
    <div class="ring" style="inset:18%"></div><div class="ring" style="inset:36%"></div>
    <div class="knob" id="kL"></div>
    <div class="ch-lbl">THR · YAW</div>
  </div>
</div>

<div class="bot">
  <div class="vg"><small>YAW</small><span class="n c1" id="v1">1500</span></div>
  <div class="vg"><small>THR</small><span class="n c2" id="v2">1500</span></div>
  <div class="vg"><small>PIT</small><span class="n c3" id="v3">1500</span></div>
  <div class="vg"><small>ROL</small><span class="n c4" id="v4">1500</span></div>
</div>

<div class="modal" id="cfg">
  <button class="x" onclick="closeCfg()">✕</button>
  <h2>Налаштування</h2>
  <div class="rw"><label>Expo</label><span class="vv" id="eV">0.30</span></div>
  <input type="range" id="eR" min="0" max="1" step="0.05" value="0.30">
  <div class="rw"><label>Rate</label><span class="vv" id="rV">1.50</span></div>
  <input type="range" id="rR" min="0.3" max="2" step="0.05" value="1.50">
  <div class="rw"><label>Deadband</label><span class="vv" id="dV">2%</span></div>
  <input type="range" id="dR" min="0" max="15" step="1" value="2">
  <div class="rw"><label>Smoothing</label><span class="vv" id="sV">1</span></div>
  <input type="range" id="sR" min="0" max="10" step="1" value="1">
  <h2 style="margin-top:16px">Режим</h2>
  <div class="mbtns">
    <button id="m2" class="a" onclick="setM(2)">Mode 2</button>
    <button id="m1" onclick="setM(1)">Mode 1</button>
  </div>
</div>

<div class="hint" id="hint">Тримай пальці на джойстиках</div>

<script>
const C={expo:.3,rate:1.5,dead:2,smooth:1,mode:2};
const ch=[1500,1500,1500,1500];
let ws;
const WS_URL='ws://'+location.hostname+':8765';

function goFS(){if(!document.fullscreenElement)document.documentElement.requestFullscreen();else document.exitFullscreen()}

function openCfg(){document.getElementById('cfg').classList.add('show')}
function closeCfg(){document.getElementById('cfg').classList.remove('show')}
function setM(m){C.mode=m;document.getElementById('m2').className=m===2?'a':'';document.getElementById('m1').className=m===1?'a':'';localStorage.setItem('fpv_m',m)}

document.getElementById('eR').oninput=function(){C.expo=+this.value;document.getElementById('eV').textContent=C.expo.toFixed(2)};
document.getElementById('rR').oninput=function(){C.rate=+this.value;document.getElementById('rV').textContent=C.rate.toFixed(2)};
document.getElementById('dR').oninput=function(){C.dead=+this.value;document.getElementById('dV').textContent=C.dead+'%'};
document.getElementById('sR').oninput=function(){C.smooth=+this.value;document.getElementById('sV').textContent=C.smooth};

class Stick{
  constructor(boxId,knobId,chX,chY,invY,springY){
    this.box=document.getElementById(boxId);
    this.knob=document.getElementById(knobId);
    this.chX=chX;
    this.chY=chY;
    this.invY=invY||false;
    this.springY=springY!==false;
    this.rawX=0;
    this.rawY=0;
    this.smX=0;
    this.smY=0;
    this.touching=false;
    this.tid=-1;
    this._bind();
  }
  _bind(){
    const el=this.box;
    el.addEventListener('touchstart',(e)=>{e.preventDefault();this._onDown(e)},{passive:false});
    el.addEventListener('touchmove',(e)=>{e.preventDefault();this._onMove(e)},{passive:false});
    el.addEventListener('touchend',(e)=>{this._onUp(e)});
    el.addEventListener('touchcancel',(e)=>{this._onUp(e)});
  }
  _getTouch(e){
    for(let i=0;i<e.changedTouches.length;i++){
      if(e.changedTouches[i].identifier===this.tid)return e.changedTouches[i];
    }
    return null;
  }
  _onDown(e){
    if(this.touching)return;
    this.touching=true;
    this.tid=e.changedTouches[0].identifier;
    this.knob.classList.add('on');
    this._calc(e.changedTouches[0]);
  }
  _onMove(e){
    if(!this.touching)return;
    const t=this._getTouch(e);
    if(t)this._calc(t);
  }
  _onUp(e){
    if(!this.touching)return;
    const t=this._getTouch(e);
    if(!t)return;
    this.touching=false;
    this.tid=-1;
    this.knob.classList.remove('on');
    this._spring();
  }
  _calc(touch){
    const r=this.box.getBoundingClientRect();
    const cx=r.left+r.width/2;
    const cy=r.top+r.height/2;
    const maxR=r.width/2-27;
    let dx=touch.clientX-cx;
    let dy=touch.clientY-cy;
    const dist=Math.sqrt(dx*dx+dy*dy);
    if(dist>maxR){dx=dx/dist*maxR;dy=dy/dist*maxR}
    this.rawX=dx/maxR;
    this.rawY=-dy/maxR;
    this._draw();
    this._send();
  }
  _draw(){
    this.knob.style.left=(50+this.rawX*50)+'%';
    this.knob.style.top=(50-this.rawY*50)+'%';
  }
  _spring(){
    const step=()=>{
      if(this.touching)return;
      this.rawX*=.8;
      if(this.springY)this.rawY*=.8;
      if(Math.abs(this.rawX)<.003)this.rawX=0;
      if(this.springY&&Math.abs(this.rawY)<.003)this.rawY=0;
      this._draw();
      this._send();
      const doneX=Math.abs(this.rawX)<.003;
      const doneY=!this.springY||Math.abs(this.rawY)<.003;
      if(!doneX||!doneY)requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }
  _send(){
    let x=this.rawX;
    let y=this.rawY;
    const e=C.expo;
    if(x!==0)x=Math.sign(x)*(Math.abs(x)+e*Math.abs(x)*(1-Math.abs(x)*Math.abs(x)));
    if(y!==0)y=Math.sign(y)*(Math.abs(y)+e*Math.abs(y)*(1-Math.abs(y)*Math.abs(y)));
    x*=C.rate;y*=C.rate;
    x=Math.max(-1,Math.min(1,x));
    y=Math.max(-1,Math.min(1,y));
    const d=C.dead/100;
    if(Math.abs(x)<d)x=0;else x=Math.sign(x)*(Math.abs(x)-d)/(1-d);
    if(Math.abs(y)<d)y=0;else y=Math.sign(y)*(Math.abs(y)-d)/(1-d);
    const s=C.smooth/100;
    this.smX+=(x-this.smX)*(1-s);
    this.smY+=(y-this.smY)*(1-s);
    let fy=this.smY;
    if(this.invY)fy=-fy;
    ch[this.chX]=Math.round(Math.max(1000,Math.min(2000,1500+this.smX*500)));
    ch[this.chY]=Math.round(Math.max(1000,Math.min(2000,1500+fy*500)));
    upd();
    send();
  }
}

let sL,sR;
function init(){
  const m=localStorage.getItem('fpv_m');
  if(m)C.mode=+m;
  if(C.mode===2){
    sL=new Stick('boxL','kL',0,1,false,false);
    sR=new Stick('boxR','kR',3,2,false);
  }else{
    sL=new Stick('boxL','kL',3,2,false);
    sR=new Stick('boxR','kR',0,1,false,false);
  }
}

function upd(){
  document.getElementById('v1').textContent=ch[0];
  document.getElementById('v2').textContent=ch[1];
  document.getElementById('v3').textContent=ch[2];
  document.getElementById('v4').textContent=ch[3];
}

function connect(){
  ws=new WebSocket(WS_URL);
  ws.onopen=()=>{
    document.getElementById('cd').classList.add('on');
    document.getElementById('ct').textContent='OK';
    document.getElementById('hint').classList.add('show');
    setTimeout(()=>document.getElementById('hint').classList.remove('show'),1500);
  };
  ws.onclose=()=>{
    document.getElementById('cd').classList.remove('on');
    document.getElementById('ct').textContent='...';
    setTimeout(connect,2000);
  };
}
function send(){
  if(!ws||ws.readyState!==1)return;
  ws.send(JSON.stringify({type:'channels',ch}));
}

init();
connect();

let fsed=false;
document.addEventListener('touchstart',()=>{if(!fsed){fsed=true;goFS()}},{once:true});
document.addEventListener('touchmove',e=>{if(!e.target.closest('.modal'))e.preventDefault()},{passive:false});
</script>
</body>
</html>
