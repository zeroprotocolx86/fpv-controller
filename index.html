<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тривога України — Мапа повітряних тривог</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:#0a0e17;color:#e0e0e0;overflow:hidden;height:100vh}
#map{width:100%;height:100vh;z-index:1}
.header{position:fixed;top:0;left:0;right:0;z-index:1000;background:rgba(10,14,23,.92);backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,255,255,.08);padding:10px 20px;display:flex;align-items:center;gap:16px}
.header h1{font-size:18px;font-weight:700;color:#fff;white-space:nowrap}
.header h1 span{color:#ef4444}
.status-pill{display:flex;align-items:center;gap:6px;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:600}
.status-pill.active{background:rgba(239,68,68,.15);color:#ef4444;animation:pulse 2s infinite}
.status-pill.clear{background:rgba(34,197,94,.15);color:#22c55e}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
.stat{font-size:12px;color:#94a3b8}
.stat b{color:#fff}
.update-time{margin-left:auto;font-size:11px;color:#64748b}
.legend{position:fixed;bottom:20px;left:20px;z-index:1000;background:rgba(10,14,23,.92);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:14px 18px;font-size:12px}
.legend-item{display:flex;align-items:center;gap:8px;margin:6px 0}
.legend-color{width:16px;height:16px;border-radius:3px;border:1px solid rgba(255,255,255,.1)}
.alert-list{position:fixed;top:60px;right:10px;z-index:1000;background:rgba(10,14,23,.92);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:12px;width:300px;max-height:calc(100vh - 80px);overflow-y:auto}
.alert-list h3{font-size:13px;color:#94a3b8;margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px}
.alert-item{display:flex;align-items:center;gap:8px;padding:8px 10px;margin:4px 0;background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.2);border-radius:8px;font-size:12px;cursor:pointer;transition:background .2s}
.alert-item:hover{background:rgba(239,68,68,.15)}
.alert-dot{width:8px;height:8px;border-radius:50%;background:#ef4444;flex-shrink:0;animation:pulse 1.5s infinite}
.alert-name{flex:1;color:#e0e0e0}
.alert-time{color:#64748b;font-size:11px;white-space:nowrap}
.no-alerts{text-align:center;color:#22c55e;padding:20px;font-size:13px}
.sidebar{position:fixed;top:60px;left:10px;z-index:1000;background:rgba(10,14,23,.92);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:14px;width:260px}
.sidebar h3{font-size:13px;color:#94a3b8;margin-bottom:10px;text-transform:uppercase;letter-spacing:.5px}
.threat-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:12px}
.threat-row:last-child{border:none}
.threat-icon{font-size:16px;margin-right:6px}
.threat-count{font-weight:700;color:#fff}
.siren-overlay{position:fixed;top:0;left:0;right:0;bottom:0;z-index:2000;background:rgba(239,68,68,.08);pointer-events:none;opacity:0;transition:opacity .3s}
.siren-overlay.on{opacity:1;animation:sirenFlash 1s infinite}
@keyframes sirenFlash{0%,100%{opacity:0}50%{opacity:1}}
.leaflet-container{background:#0a0e17!important}
</style>
</head>
<body>

<div class="siren-overlay" id="sirenOverlay"></div>

<div class="header">
  <h1>TRIVOHA<span>.</span>UA</h1>
  <div class="status-pill" id="statusPill">
    <span id="statusDot"></span>
    <span id="statusText">Завантаження...</span>
  </div>
  <div class="stat">Активних тривог: <b id="alertCount">0</b></div>
  <div class="stat">Загроз: <b id="threatCount">0</b></div>
  <div class="update-time" id="updateTime">—</div>
</div>

<div class="sidebar" id="sidebar">
  <h3>Статистика загроз</h3>
  <div id="threatStats">Завантаження...</div>
</div>

<div class="alert-list" id="alertList">
  <h3>Активні тривоги</h3>
  <div id="alertItems">Завантаження...</div>
</div>

<div class="legend">
  <div class="legend-item"><div class="legend-color" style="background:#ef4444"></div>Активна тривога</div>
  <div class="legend-item"><div class="legend-color" style="background:#f59e0b"></div>Попередження</div>
  <div class="legend-item"><div class="legend-color" style="background:#1e293b"></div>Без тривоги</div>
  <div class="legend-item"><div class="legend-color" style="background:#3b82f6"></div>Дрон / Ракета</div>
</div>

<div id="map"></div>

<script>
const API_BASE = 'https://tryvoha.online/api/v1';
const REFRESH_INTERVAL = 30000;
const UKRAINE_CENTER = [48.3794, 31.1656];
const UKRAINE_ZOOM = 6;

// Oblast slug -> center coordinates for drone/missile markers
const OBLAST_CENTERS = {
  'vinnicka-oblast': [49.2331, 28.4682],
  'volinska-oblast': [50.7472, 25.3254],
  'dnipropetrovska': [48.4647, 35.0462],
  'donecka-oblast': [48.0159, 37.8029],
  'zhitomirska-oblast': [50.2547, 28.6587],
  'zakarpatska-oblast': [48.6208, 22.2879],
  'zaporizka-oblast': [47.8388, 35.1396],
  'ivano-frankivska-oblast': [48.9226, 24.7111],
  'kyivska': [50.4501, 30.5234],
  'kirovogradska-oblast': [48.5079, 32.2623],
  'luganska-oblast': [48.5740, 39.3078],
  'lvivska': [49.8397, 24.0297],
  'kyiv': [50.4501, 30.5234],
  'mikolayivska-oblast': [46.9750, 31.9946],
  'odeska': [46.4825, 30.7233],
  'poltavska-oblast': [49.5883, 34.5514],
  'rivnenska-oblast': [50.6199, 26.2516],
  'sumska-oblast': [50.9077, 34.7981],
  'ternopilska-oblast': [49.5535, 25.5948],
  'xarkivska-oblast': [49.9935, 36.2304],
  'xersonska-oblast': [46.6354, 32.6169],
  'xmelnycka-oblast': [49.4230, 26.9871],
  'cherkaska-oblast': [49.4444, 32.0598],
  'cernivecka-oblast': [48.2920, 25.9358],
  'cernigivska-oblast': [51.4982, 31.2893]
};

// Initialize map
const map = L.map('map', {
  center: UKRAINE_CENTER,
  zoom: UKRAINE_ZOOM,
  zoomControl: false,
  attributionControl: false
});

L.control.zoom({position:'bottomright'}).addTo(map);

// Dark tiles
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  maxZoom: 18
}).addTo(map);

// Layer groups
let alertLayer = L.layerGroup().addTo(map);
let droneLayer = L.layerGroup().addTo(map);
let regionLabels = L.layerGroup().addTo(map);

// Ukraine GeoJSON (simplified)
let ukraineGeo = null;
let alertSlugs = new Set();

// Fetch Ukraine boundaries
async function loadUkraineGeo() {
  try {
    const resp = await fetch('https://raw.githubusercontent.com/codeforamerica/click_that_hood/master/public/data/ukraine.geojson');
    ukraineGeo = await resp.json();
    drawRegions({});
  } catch(e) {
    console.warn('GeoJSON load failed, using circles fallback');
  }
}

function getOblastSlug(name) {
  const map = {
    'Vinnytsia':'vinnicka-oblast','Volyn':'volinska-oblast','Dnipropetrovsk':'dnipropetrovska',
    'Donetsk':'donecka-oblast','Zhytomyr':'zhitomirska-oblast','Zakarpattia':'zakarpatska-oblast',
    'Zaporizhzhia':'zaporizka-oblast','Ivano-Frankivsk':'ivano-frankivska-oblast',
    'Kyiv':'kyivska','Kirovohrad':'kirovogradska-oblast','Luhansk':'luganska-oblast',
    'Lviv':'lvivska','Mykolaiv':'mikolayivska-oblast','Odesa':'odeska',
    'Poltava':'poltavska-oblast','Rivne':'rivnenska-oblast','Sumy':'sumska-oblast',
    'Ternopil':'ternopilska-oblast','Kharkiv':'xarkivska-oblast','Kherson':'xersonska-oblast',
    'Khmelnytskyi':'xmelnycka-oblast','Cherkasy':'cherkaska-oblast',
    'Chernivtsi':'cernivecka-oblast','Chernihiv':'cernigivska-oblast','Sevastopol':'krim'
  };
  for (const [key, slug] of Object.entries(map)) {
    if (name.includes(key)) return slug;
  }
  return null;
}

function drawRegions(alertsData) {
  if (!ukraineGeo) return;
  alertLayer.clearLayers();

  const activeSlugs = new Set();
  if (alertsData.alerts) {
    alertsData.alerts.forEach(a => activeSlugs.add(a.slug));
  }

  L.geoJSON(ukraineGeo, {
    style: feature => {
      const name = feature.properties.name || '';
      const slug = getOblastSlug(name);
      const isActive = slug && (activeSlugs.has(slug) || alertsData.alerts?.some(a => a.oblast_slug === slug));
      return {
        fillColor: isActive ? '#ef4444' : '#1e293b',
        fillOpacity: isActive ? 0.45 : 0.25,
        color: isActive ? '#ef4444' : '#334155',
        weight: isActive ? 2 : 1,
        opacity: isActive ? 0.9 : 0.4
      };
    },
    onEachFeature: (feature, layer) => {
      const name = feature.properties.name || 'Unknown';
      const slug = getOblastSlug(name);
      const isActive = slug && (activeSlugs.has(slug) || alertsData.alerts?.some(a => a.oblast_slug === slug));
      layer.bindTooltip(`<b>${name}</b><br>${isActive ? '🔴 ТРИВОГА' : '🟢 Спокійно'}`, {
        className: 'dark-tooltip'
      });
      layer.on('click', () => {
        if (slug) {
          const center = layer.getBounds().getCenter();
          map.setView(center, 8);
        }
      });
    }
  }).addTo(alertLayer);
}

function drawDroneMarkers(alertsData) {
  droneLayer.clearLayers();
  if (!alertsData.alerts) return;

  alertsData.alerts.forEach(alert => {
    const coords = OBLAST_CENTERS[alert.oblast_slug] || OBLAST_CENTERS[alert.slug];
    if (!coords) return;

    // Random offset for visual separation
    const lat = coords[0] + (Math.random() - 0.5) * 0.8;
    const lng = coords[1] + (Math.random() - 0.5) * 0.8;

    const marker = L.circleMarker([lat, lng], {
      radius: 6,
      fillColor: '#3b82f6',
      fillOpacity: 0.9,
      color: '#60a5fa',
      weight: 2,
      opacity: 0.8
    });

    const startTime = new Date(alert.started_at);
    const now = new Date();
    const mins = Math.floor((now - startTime) / 60000);

    marker.bindPopup(`
      <div style="font-family:system-ui;color:#e0e0e0;background:#1e293b;padding:12px;border-radius:8px;min-width:200px">
        <b style="font-size:14px">⚠️ ${alert.name_uk || alert.name_en}</b><br>
        <span style="color:#94a3b8">${alert.name_en || ''}</span><br><br>
        <span style="color:#ef4444">Тривога: ${mins} хв</span><br>
        <span style="color:#64748b">Початок: ${startTime.toLocaleTimeString('uk-UA')}</span><br>
        <span style="color:#64748b">Тип: ${alert.type}</span>
      </div>
    `, {className: 'dark-popup'});

    droneLayer.addLayer(marker);
  });
}

function updateAlertList(alertsData) {
  const container = document.getElementById('alertItems');
  const count = document.getElementById('alertCount');
  const pill = document.getElementById('statusPill');
  const dot = document.getElementById('statusDot');
  const text = document.getElementById('statusText');

  if (!alertsData.alerts || alertsData.alerts.length === 0) {
    container.innerHTML = '<div class="no-alerts">🟢 Немає активних тривог</div>';
    count.textContent = '0';
    pill.className = 'status-pill clear';
    dot.textContent = '🟢';
    text.textContent = 'Спокійно';
    document.getElementById('sirenOverlay').classList.remove('on');
    return;
  }

  // Group by oblast
  const byOblast = {};
  alertsData.alerts.forEach(a => {
    const ob = a.oblast_slug || a.slug;
    if (!byOblast[ob]) byOblast[ob] = [];
    byOblast[ob].push(a);
  });

  const oblastCount = Object.keys(byOblast).length;
  count.textContent = oblastCount;
  pill.className = 'status-pill active';
  dot.textContent = '🔴';
  text.textContent = `ТРИВОГА — ${oblastCount} областей`;
  document.getElementById('sirenOverlay').classList.add('on');

  let html = '';
  alertsData.alerts.forEach(a => {
    const start = new Date(a.started_at);
    const mins = Math.floor((Date.now() - start) / 60000);
    html += `<div class="alert-item" onclick="focusAlert('${a.oblast_slug || a.slug}')">
      <div class="alert-dot"></div>
      <div class="alert-name">${a.name_uk || a.name_en}</div>
      <div class="alert-time">${mins}хв</div>
    </div>`;
  });
  container.innerHTML = html;
}

function updateStats(alertsData) {
  const container = document.getElementById('threatStats');
  if (!alertsData.alerts) {
    container.innerHTML = '<div style="color:#64748b">Немає даних</div>';
    return;
  }

  const byType = {state:0, district:0, community:0};
  alertsData.alerts.forEach(a => {
    byType[a.type] = (byType[a.type] || 0) + 1;
  });

  document.getElementById('threatCount').textContent = alertsData.alerts.length;

  container.innerHTML = `
    <div class="threat-row"><span><span class="threat-icon">🏛️</span>Області</span><span class="threat-count">${byType.state || 0}</span></div>
    <div class="threat-row"><span><span class="threat-icon">📍</span>Райони</span><span class="threat-count">${byType.district || 0}</span></div>
    <div class="threat-row"><span><span class="threat-icon">🏘️</span>Громади</span><span class="threat-count">${byType.community || 0}</span></div>
    <div class="threat-row"><span><span class="threat-icon">🕐</span>Оновлення</span><span class="threat-count" style="font-size:11px">${new Date().toLocaleTimeString('uk-UA')}</span></div>
  `;
}

function focusAlert(slug) {
  const coords = OBLAST_CENTERS[slug];
  if (coords) {
    map.setView(coords, 8, {animate: true});
  }
}

async function fetchAlerts() {
  try {
    const resp = await fetch(`${API_BASE}/alerts`);
    const data = await resp.json();
    document.getElementById('updateTime').textContent = `Оновлено: ${new Date().toLocaleTimeString('uk-UA')}`;
    drawRegions(data);
    drawDroneMarkers(data);
    updateAlertList(data);
    updateStats(data);
  } catch(e) {
    console.error('API error:', e);
    document.getElementById('updateTime').textContent = 'Помилка завантаження';
  }
}

// Init
loadUkraineGeo();
fetchAlerts();
setInterval(fetchAlerts, REFRESH_INTERVAL);

// Sound notification for new alerts
let lastAlertCount = 0;
setInterval(() => {
  const count = parseInt(document.getElementById('alertCount').textContent) || 0;
  if (count > lastAlertCount && lastAlertCount >= 0) {
    try { new Audio('data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoGAACBhYqFbF1fdJivrJBhNjVggoKIaF9RXH+FjHpnT0Vyf4aLd2FTUWd7hYd0ZlJLbH2Fh3NlUUdsfISGc2VRR2t9hIZzZVFIa32EhXJkUEdqfYSEc2RQR2p9hIRyZF workaround for beep`).play(); } catch(e) {}
  }
  lastAlertCount = count;
}, 2000);
</script>
</body>
</html>
